name: dna-exercises
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - setuptools<82
  # Avoid loading a second OpenMP runtime alongside the PyTorch wheel.
  - libopenblas=*=*pthreads*
  - numpy>=2,<3
  - matplotlib>=3.9,<4
  - scikit-learn>=1.5,<2
  - biopython>=1.85,<2
  - jupyterlab>=4,<5
  - ipykernel>=6,<8
  - nbconvert>=7,<8
  - tqdm>=4,<5
  - tensorboard>=2,<3
# Install ONE platform-specific PyTorch requirements file afterwards.
